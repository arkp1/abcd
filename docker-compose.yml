version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    # No REACT_APP_API_URL here: the frontend is a static build served by
    # nginx (env vars at container runtime cannot change already-built JS).
    # The bundle calls relative /api/* and nginx proxies that to backend:8000
    # (see frontend/nginx.conf).

